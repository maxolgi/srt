name: Linux Virtual Transport

on:
  push:
    branches: [ "master", "dev", "ci-rehearsal" ]
  pull_request:
    branches: [ "master", "dev" ]
    types: [opened, synchronize, reopened]

jobs:
  build:
    strategy:
        matrix:
            include:
                - name: ENABLE_VIRTUAL_TRANSPORT=ON, C++03, POSIX sync
                  virtual_transport: ON
                  std: 03
                  extra_flags: "-sync posix"
                - name: ENABLE_VIRTUAL_TRANSPORT=ON, C++17
                  virtual_transport: ON
                  std: 17
                  extra_flags: ""
                - name: ENABLE_VIRTUAL_TRANSPORT=OFF, C++17
                  virtual_transport: OFF
                  std: 17
                  extra_flags: ""
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v3

    - name: prepare
      run: ./scripts/workflows/build/ubuntu-prepare-environment.sh

    - name: configure
      # The C++03 leg mirrors ubuntu-c++03.yml: the srtcore seam of
      # this feature must stay C++98-clean, so the strictest leg builds
      # it at the -std 03 floor with warnings as errors.
      run: >
        ./scripts/workflows/build/configure.sh _build ${{ matrix.extra_flags }} -std ${{ matrix.std }}
        -bonding on -werror on -ut on -- -DENABLE_VIRTUAL_TRANSPORT=${{ matrix.virtual_transport }}

    - name: build
      run: ./scripts/workflows/build/build.sh _build

    - name: test
      # The virtual transport tests exist only in the ON build; the
      # stock-build rejection tests only have content in the OFF build.
      # Run the full suite in every leg so neither side silently rots.
      # Tests bind port 0 and read the assigned port back, so the suite
      # is safe to run in parallel. The -E list mirrors windows-msvc-noenc.yml
      # (these tests hang or flake on shared runners), and --timeout caps any
      # other hang at 60s instead of ctest's 1500s default.
      run: cd _build && ctest --output-on-failure -j 4 --timeout 60 -E "TestIPv6.v6_calls_v4|TestConnectionTimeout.BlockingLoop"
